<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f4ed"><title>Owner inventory | Swarnika Gold</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#241b17;--muted:#82766a;--gold:#aa783c;--cream:#f8f4ed;--paper:#fffdfa;--line:#e9e0d5;--wine:#53241f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px 'DM Sans',sans-serif}.top{padding:16px 6%;background:#fffdfa;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:23px 'Playfair Display',serif;letter-spacing:.12em}.brand small{display:block;text-align:center;font:9px 'DM Sans';color:var(--gold);letter-spacing:.3em}.top a,.top button{color:var(--ink);background:none;border:1px solid var(--line);padding:10px 14px;text-decoration:none;font:12px 'DM Sans';cursor:pointer}.wrap{max-width:1050px;margin:45px auto;padding:0 20px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase}.wrap h1{font:42px 'Playfair Display',serif;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.7}.panel{background:var(--paper);border:1px solid var(--line);padding:26px;margin:22px 0}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:10px;letter-spacing:.13em;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:white;padding:12px;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.btn{border:0;background:var(--wine);color:white;padding:13px 18px;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;font-size:11px}.notice{margin-top:14px;color:var(--muted);font-size:13px}.msg{padding:12px;background:#f3ecdf;margin:12px 0}.hidden{display:none!important}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.item{background:white;border:1px solid var(--line);padding:12px}.item img{width:100%;height:190px;object-fit:cover}.item h3{font:20px 'Playfair Display',serif;margin:10px 0 4px}.item p{font-size:12px;color:var(--muted)}.item button{border:1px solid var(--line);background:white;padding:8px 10px;cursor:pointer}@media(max-width:600px){.wrap{margin:28px auto}.wrap h1{font-size:34px}.grid{grid-template-columns:1fr}.panel{padding:18px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="top"><a class="brand" href="./">SWARNIKA<small>G O L D · OWNER</small></a><div><a href="./">View shop</a> <button id="logout" class="hidden">Sign out</button></div></header><main class="wrap"><div class="eyebrow">Private inventory</div><h1>Owner dashboard</h1><p class="muted">Sign in with your Swarnika owner email to add jewellery, photos, prices and available stock. Only the authorised owner account can change products.</p><section id="login" class="panel"><h2>Owner sign in</h2><form id="loginForm"><div class="field"><label for="ownerEmail">Owner email</label><input id="ownerEmail" type="email" value="vedantaenterprises2014@gmail.com" readonly></div><button class="btn">Email me a secure sign-in link</button></form><div id="loginMsg" class="notice"></div></section><section id="dashboard" class="hidden"><div class="panel"><h2>Add stock</h2><form id="productForm"><div class="grid"><div class="field"><label>Product name</label><input name="name" maxlength="80" required placeholder="e.g. Gold temple necklace"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="1" step="1" required></div><div class="field"><label>Category</label><select name="category"><option>Necklaces</option><option>Earrings</option><option>Rings</option><option>Bracelets</option><option>Other</option></select></div><div class="field"><label>Available stock</label><input name="stock" type="number" min="0" step="1" value="1" required></div></div><div class="field"><label>Short description</label><input name="description" maxlength="160" placeholder="Gold finish · handcrafted"></div><div class="field"><label>Product photo (JPG, PNG or WEBP · up to 8 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div><button id="saveBtn" class="btn">Upload photo and add product</button><div id="formMsg" class="notice"></div></form></div><div class="panel"><h2>Your listed stock</h2><div id="productList" class="products"></div></div></section></main><script>
const OWNER='vedantaenterprises2014@gmail.com';const db=window.supabase.createClient('https://vuvvliyclsmbwdislcbp.supabase.co','sb_publishable_QM9galJwG7XvI07THbTnAA_nSQztzbb');const login=document.getElementById('login'),dashboard=document.getElementById('dashboard'),loginMsg=document.getElementById('loginMsg'),formMsg=document.getElementById('formMsg'),logout=document.getElementById('logout');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function setSession(session){if(!session){login.classList.remove('hidden');dashboard.classList.add('hidden');logout.classList.add('hidden');return}if((session.user.email||'').toLowerCase()!==OWNER){await db.auth.signOut();loginMsg.textContent='This email is not authorised for the owner dashboard.';return}login.classList.add('hidden');dashboard.classList.remove('hidden');logout.classList.remove('hidden');await loadProducts()}
db.auth.getSession().then(({data})=>setSession(data.session));db.auth.onAuthStateChange((_event,session)=>setTimeout(()=>setSession(session),0));
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginMsg.textContent='Sending secure sign-in link…';const{error}=await db.auth.signInWithOtp({email:OWNER,options:{emailRedirectTo:location.origin+location.pathname}});loginMsg.textContent=error?error.message:'Check your email and open the secure sign-in link on this device.'});logout.addEventListener('click',()=>db.auth.signOut());
async function loadProducts(){const box=document.getElementById('productList');box.innerHTML='Loading…';const{data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){box.textContent=error.message;return}box.innerHTML=data.length?data.map(p=>'<article class="item"><img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'"><h3>'+esc(p.name)+'</h3><p>₹'+Number(p.price).toLocaleString('en-IN')+' · '+esc(p.category)+' · Stock: '+Number(p.stock)+'</p><p>'+esc(p.description||'')+'</p><button data-delete="'+esc(p.id)+'">Delete product</button></article>').join(''):'No products added yet.'}
document.getElementById('productForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,photo=f.elements.photo.files[0];if(!photo||photo.size>8*1024*1024){formMsg.textContent='Choose a photo under 8 MB.';return}const safe=photo.name.toLowerCase().replace(/[^a-z0-9._-]/g,'-');const path=Date.now()+'-'+safe;const save=document.getElementById('saveBtn');save.disabled=true;formMsg.textContent='Uploading photo…';const up=await db.storage.from('product-photos').upload(path,photo,{contentType:photo.type,upsert:false});if(up.error){formMsg.textContent=up.error.message;save.disabled=false;return}const{data:pub}=db.storage.from('product-photos').getPublicUrl(path);const{error}=await db.from('products').insert({name:f.elements.name.value.trim(),price:Number(f.elements.price.value),category:f.elements.category.value,stock:Number(f.elements.stock.value),description:f.elements.description.value.trim(),image_url:pub.publicUrl});if(error){formMsg.textContent='Photo uploaded, but product save failed: '+error.message;save.disabled=false;return}formMsg.textContent='Product added to your live shop.';f.reset();f.elements.stock.value=1;save.disabled=false;await loadProducts()});
document.getElementById('productList').addEventListener('click',async e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(!confirm('Remove this product from the public shop?'))return;const{error}=await db.from('products').delete().eq('id',b.dataset.delete);if(error){alert(error.message);return}await loadProducts()});
</script></body></html>
